name: Documentation site validation

on:
  pull_request:
    paths:
      - 'doc-sites/**'
      - '.github/workflows/docs-validation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Documentation site validation
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: doc-sites
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: doc-sites/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      # prebuild runs locale regression tests and rejects missing/stale translations.
      - run: npm run build
