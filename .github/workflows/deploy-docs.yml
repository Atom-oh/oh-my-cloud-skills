name: Build AWS Docs Release

on:
  push:
    branches: [main]
    paths: ['doc-sites/**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: "aws-docs-release"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: doc-sites
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: doc-sites/package-lock.json
      - run: npm ci
      - run: npm ci --prefix server
      - run: npm run typecheck
      - run: npm run test:server
      - run: npm run package:aws
      - uses: actions/upload-artifact@v4
        with:
          name: skills-guide-web-function
          path: |
            doc-sites/infra/artifacts/site.zip
            doc-sites/infra/assets.yaml
            doc-sites/infra/site.yaml
            doc-sites/infra/README.md
          if-no-files-found: error
          retention-days: 14
