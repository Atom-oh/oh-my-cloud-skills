title: "Multi-AZ Web 3-Tier"
external:
  - {id: users, icon: users, label: "Users"}
edge:
  - {id: cf, icon: cloudfront, label: "Amazon CloudFront"}
region:
  label: "AWS Region (us-east-1)"
  vpc:
    label: "VPC 10.0.0.0/16"
    azs: ["Availability Zone A", "Availability Zone C"]
    tiers:
      - {name: "Public Subnet", kind: public, services: [{id: alb, icon: alb, label: "ALB"}]}
      - {name: "Private App Subnet", kind: private, services: [{id: ecs, icon: ecs, label: "ECS Fargate"}]}
      - {name: "Private Data Subnet", kind: private, services: [{id: rds, icon: rds, label: "RDS"}]}
flows:
  - {from: users, to: cf, label: "HTTPS"}
  - {from: cf, to: alb_0, label: "origin"}
  - {from: alb_0, to: ecs_0, label: "route"}
  - {from: alb_0, to: ecs_1, label: "route"}
  - {from: ecs_0, to: rds_0, label: "query"}
  - {from: ecs_1, to: rds_0, label: "query"}
  - {from: rds_0, to: rds_1, label: "replicate", kind: async}
