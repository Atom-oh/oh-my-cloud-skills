<!doctype html><html><head><meta charset="utf-8"><style>
  html,body{margin:0;width:1920px;height:1080px;background:#fff;font-family:system-ui;overflow:hidden}
  .slide{width:1920px;height:1080px;padding:60px 80px;box-sizing:border-box;display:flex;flex-direction:column}
  h1{font-size:44px;margin:0 0 8px;color:#232f3e} p.sub{font-size:20px;color:#5f6b7a;margin:0 0 24px}
  .diagram{flex:1;border:1px solid #e5e7eb;border-radius:12px;overflow:hidden}
  iframe{width:100%;height:100%;border:0}
  .kbd-probe{position:fixed;bottom:12px;right:16px;font-size:14px;color:#888}
</style></head><body>
<div class="slide" tabindex="0" id="deck">
  <h1>EKS Web Service — Reference Architecture</h1>
  <p class="sub">Archify interactive diagram · official AWS icons · embedded via iframe</p>
  <div class="diagram"><iframe src="poc-aws-icons.html" title="architecture diagram"></iframe></div>
  <div class="kbd-probe" id="probe">keys: 0</div>
</div>
<script>
  let n=0; document.addEventListener('keydown', e=>{ if(e.key==='ArrowRight'){n++;document.getElementById('probe').textContent='keys: '+n;} });
</script>
</body></html>
