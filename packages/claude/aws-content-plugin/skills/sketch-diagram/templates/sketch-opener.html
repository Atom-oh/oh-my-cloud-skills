<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sketch opener diagram</title>
<!--
  Template: hand-drawn animated opener diagram (three bands, one feedback loop).
  Replace every label and the flow story with the user's topic. Do not keep this
  topology unless the topic really has it.

  Inside a deck, put the sk-* rules (in a <style>) and the <svg> together in one `:::html`
  block, and delete the PREVIEW-ONLY block below. The deck already defines the role
  tokens used here (--surface-*, --on-surface*, --accent, --info, --success).
-->
<style>
/* PREVIEW-ONLY: stand-in tokens so the file opens on its own. Remove inside a deck. */
:root, .theme-light { --surface-1:#f6f7f9; --surface-2:#ffffff; --surface-3:#d5d9e0; --on-surface:#1f2933; --on-surface-muted:#5b6672; --accent:#c2570c; --info:#1f6fb2; --success:#2b7a4b; --warning:#a87a00; }
.theme-dark { --surface-1:#161e2d; --surface-2:#1f2a3c; --surface-3:#34425a; --on-surface:#e8edf5; --on-surface-muted:#9fb0c6; --accent:#ff9900; --info:#6cb6f0; --success:#5fcf8a; --warning:#f2c94c; }
@media (prefers-color-scheme: dark) { :root:not(.theme-light) { --surface-1:#161e2d; --surface-2:#1f2a3c; --surface-3:#34425a; --on-surface:#e8edf5; --on-surface-muted:#9fb0c6; --accent:#ff9900; --info:#6cb6f0; --success:#5fcf8a; --warning:#f2c94c; } }
body { margin:0; background:var(--surface-1); color:var(--on-surface); display:grid; place-items:center; min-height:100vh; }

/* ---- sk-* rules: copy into a <style> at the top of the deck's :::html block ---- */
.sk-wrap { width:100%; max-height:500px; container-type:inline-size; }
.sk-svg { width:100%; height:auto; max-height:500px; display:block; color:var(--on-surface);
  --sk-loop:3s; font-family:'Gaegu','Nanum Pen Script','Comic Sans MS','Segoe Print',cursive; }
.sk-ink    { fill:none; stroke:currentColor; stroke-width:2; stroke-linecap:round; stroke-linejoin:round; filter:url(#sk-rough); }
.sk-thin   { stroke-width:1.5; }
.sk-dash   { stroke-dasharray:5 5; }
.sk-card   { fill:var(--surface-2); }
.sk-wash-a { fill:color-mix(in srgb, var(--accent) 12%, var(--surface-1)); }
.sk-wash-i { fill:color-mix(in srgb, var(--info) 12%, var(--surface-1)); }
.sk-wash-s { fill:color-mix(in srgb, var(--success) 12%, var(--surface-1)); }
.sk-stamp  { fill:currentColor; }
.sk-stampn { fill:var(--surface-1); font-size:17px; font-weight:700; text-anchor:middle; }
.sk-title  { fill:currentColor; font-size:26px; font-weight:700; text-anchor:middle; }
.sk-label  { fill:currentColor; font-size:19px; text-anchor:middle; }
.sk-note   { fill:var(--on-surface-muted); font-size:16px; text-anchor:middle; }
.sk-arrowhead { fill:currentColor; }
.sk-dot    { r:5; offset-rotate:0deg; animation:sk-run var(--sk-loop) linear infinite; }
.sk-dot.a  { fill:var(--accent); } .sk-dot.i { fill:var(--info); } .sk-dot.s { fill:var(--success); }
.sk-dot.slow { animation-duration:calc(var(--sk-loop) * 2); }
.sk-star   { fill:currentColor; transform-box:fill-box; transform-origin:center; animation:sk-pulse calc(var(--sk-loop) / 2) ease-in-out infinite; }
.sk-spin   { transform-box:fill-box; transform-origin:center; animation:sk-turn calc(var(--sk-loop) * 4) linear infinite; }
@keyframes sk-run   { from { offset-distance:0%; } to { offset-distance:100%; } }
@keyframes sk-pulse { 0%,100% { transform:scale(1); opacity:.75; } 50% { transform:scale(1.3); opacity:1; } }
@keyframes sk-turn  { to { transform:rotate(360deg); } }
@media (prefers-reduced-motion: reduce) { .sk-dot, .sk-star, .sk-spin { animation:none; } .sk-dot { display:none; } }
</style>
</head>
<body class="theme-light">
<div class="sk-wrap">
<svg class="sk-svg" viewBox="0 0 960 450" role="img" aria-label="질문이 맥락과 만나 판단과 실행을 거쳐 결과로 모이고, 부족하면 다시 처음으로 돌아가는 흐름">
  <defs>
    <!-- One shared wobble filter gives every ink line its hand-drawn shake. -->
    <filter id="sk-rough" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.035" numOctaves="2" seed="7" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="3.2" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <path id="sk-star" d="M0 -9 Q1.4 -1.4 9 0 Q1.4 1.4 0 9 Q-1.4 1.4 -9 0 Q-1.4 -1.4 0 -9Z"/>
  </defs>

  <!-- bands -->
  <g>
    <rect class="sk-wash-a sk-ink" x="20"  y="50" width="280" height="330" rx="18"/>
    <rect class="sk-wash-i sk-ink" x="340" y="50" width="280" height="330" rx="18"/>
    <rect class="sk-wash-s sk-ink" x="660" y="50" width="280" height="330" rx="18"/>
    <text class="sk-title" x="160" y="90">들어온다</text>
    <text class="sk-title" x="480" y="90">생각한다</text>
    <text class="sk-title" x="800" y="90">끝낸다</text>
    <g><circle class="sk-stamp" cx="48"  cy="72" r="15"/><text class="sk-stampn" x="48"  y="78">1</text></g>
    <g><circle class="sk-stamp" cx="368" cy="72" r="15"/><text class="sk-stampn" x="368" y="78">2</text></g>
    <g><circle class="sk-stamp" cx="688" cy="72" r="15"/><text class="sk-stampn" x="688" y="78">3</text></g>
  </g>

  <!-- cards: one doodle icon plus a short label each -->
  <g>
    <rect class="sk-card sk-ink sk-thin" x="55" y="125" width="210" height="85" rx="8"/>
    <g class="sk-ink" transform="translate(95 168)"><circle cx="0" cy="-14" r="8"/><path d="M-14 16 Q0 -6 14 16"/></g>
    <text class="sk-label" x="190" y="174">질문 한 줄</text>

    <rect class="sk-card sk-ink sk-thin" x="55" y="245" width="210" height="85" rx="8"/>
    <g class="sk-ink sk-thin" transform="translate(80 262)"><path d="M0 0 H26 L34 8 V50 H0Z"/><path d="M26 0 V8 H34"/><path d="M7 22 H27 M7 31 H27 M7 40 H20"/></g>
    <text class="sk-label" x="180" y="294">맥락 문서</text>

    <rect class="sk-card sk-ink sk-thin" x="375" y="125" width="210" height="85" rx="8"/>
    <g transform="translate(412 168)"><g class="sk-spin"><circle class="sk-ink" cx="0" cy="0" r="9"/><path class="sk-ink" d="M0 -17 V-12 M0 12 V17 M-17 0 H-12 M12 0 H17 M-12 -12 L-9 -9 M9 9 L12 12 M12 -12 L9 -9 M-9 9 L-12 12"/></g></g>
    <text class="sk-label" x="510" y="174">길을 고른다</text>

    <rect class="sk-card sk-ink sk-thin" x="375" y="245" width="210" height="85" rx="8"/>
    <g class="sk-ink sk-thin" transform="translate(396 268)"><rect x="0" y="0" width="38" height="30" rx="4"/><path d="M8 10 L16 16 L8 22 M20 24 H30"/></g>
    <text class="sk-label" x="512" y="294">도구 실행</text>

    <rect class="sk-card sk-ink sk-thin" x="695" y="125" width="210" height="85" rx="8"/>
    <g class="sk-ink" transform="translate(735 168)"><circle cx="0" cy="0" r="15"/><path d="M-7 1 L-2 7 L8 -6"/></g>
    <text class="sk-label" x="835" y="174">결과 확인</text>

    <rect class="sk-card sk-ink sk-thin" x="695" y="245" width="210" height="85" rx="8"/>
    <g class="sk-ink sk-thin" transform="translate(716 262)"><path d="M0 0 H34 V46 H0Z"/><path d="M7 14 H27 M7 24 H27 M7 34 H19"/></g>
    <text class="sk-label" x="832" y="294">기록 남기기</text>
  </g>

  <!-- edges: gently bowed lines, never ruler straight -->
  <g class="sk-ink">
    <path d="M265 170 Q310 158 372 170"/><path class="sk-arrowhead" d="M372 170 l-9 -5 v10z"/>
    <path d="M265 290 Q310 302 372 290"/><path class="sk-arrowhead" d="M372 290 l-9 -5 v10z"/>
    <path d="M480 210 Q470 228 480 243"/><path class="sk-arrowhead" d="M480 244 l-5 -9 h10z"/>
    <path d="M585 170 Q630 158 692 170"/><path class="sk-arrowhead" d="M692 170 l-9 -5 v10z"/>
    <path d="M585 290 Q630 302 692 290"/><path class="sk-arrowhead" d="M692 290 l-9 -5 v10z"/>
    <!-- the loop is part of the story, so it is solid, not dashed -->
    <path d="M800 332 Q480 450 160 332"/><path class="sk-arrowhead" d="M160 332 l8 8 l3 -11z"/>
  </g>
  <text class="sk-note" x="480" y="420">부족하면 다시 처음으로</text>

  <!-- flow dots follow the same curves: forward, merge, and the way back -->
  <g>
    <circle class="sk-dot a" style="offset-path:path('M265 170 Q310 158 372 170')"/>
    <circle class="sk-dot a" style="offset-path:path('M265 290 Q310 302 372 290'); animation-delay:-1s"/>
    <circle class="sk-dot i" style="offset-path:path('M585 170 Q630 158 692 170'); animation-delay:-.5s"/>
    <circle class="sk-dot i" style="offset-path:path('M585 290 Q630 302 692 290'); animation-delay:-1.5s"/>
    <circle class="sk-dot s slow" style="offset-path:path('M800 332 Q480 450 160 332')"/>
    <circle class="sk-dot s slow" style="offset-path:path('M800 332 Q480 450 160 332'); animation-delay:-3s"/>
  </g>

  <!-- sparkles: a few, beside the headline of the idea -->
  <use class="sk-star" href="#sk-star" x="262" y="26"/>
  <use class="sk-star" href="#sk-star" x="698" y="26" style="animation-delay:-.7s"/>
  <text class="sk-title" x="480" y="34" font-size="22">한 번 돌고 나면 다음 번은 쉬워져요</text>
</svg>
</div>
</body>
</html>
